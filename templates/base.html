{% load static %}
<!doctype html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ministry Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20260520-1644">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'dashboard:home' %}">Ministry Portal</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard:home' %}">Dashboard</a>
                <a href="{% url 'analytics:statistics' %}">Statistics</a>
                <a href="{% url 'admin:index' %}">Admin</a>
                <form action="{% url 'logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% endif %}
        </nav>
    </header>
    <main class="page">
        {% if messages %}
            <section class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
